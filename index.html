<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="粵英通"><title>粵英通 · 英語廣東話翻譯</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#102b49;font-family:-apple-system,BlinkMacSystemFont,'PingFang HK',sans-serif}main{max-width:550px;margin:auto;padding:24px 18px 45px}h1{font-size:30px;margin:10px 0 3px}.sub{color:#52677b;margin:0 0 24px}.panel{background:white;border-radius:22px;padding:19px;margin:14px 0;box-shadow:0 3px 16px #17355212}.big{display:block;width:100%;border:0;border-radius:25px;background:#1264cc;color:white;font-size:23px;font-weight:700;padding:24px;margin:20px 0 9px}.big:disabled{opacity:.5}.row{display:flex;gap:9px;flex-wrap:wrap}.small{border:1px solid #c8d5e5;background:#fff;color:#12365b;border-radius:13px;padding:11px;font-size:15px;flex:1}textarea{width:100%;border:1px solid #d2dce8;border-radius:13px;padding:12px;min-height:92px;font:18px/1.5 inherit;resize:vertical}label{display:block;font-weight:650;margin-bottom:8px}.status{min-height:42px;color:#49637c;text-align:center}#translated{font-size:21px;line-height:1.55;white-space:pre-wrap;min-height:40px}.hint{font-size:13px;line-height:1.6;color:#64768a}select{font:inherit;border:1px solid #c8d5e5;border-radius:10px;padding:8px;background:white;color:#102b49}</style></head><body><main><h1>🎙️ 粵英通</h1><p class="sub">English ↔ 廣東話 · 免費試用版</p><div class="panel"><div class="row"><label for="recognitionLang">語音辨認模式</label><select id="recognitionLang"><option value="zh-HK">廣東話優先</option><option value="en-GB">English 優先</option></select></div><button id="mic" class="big">🎙️ 按一下開始講嘢</button><div id="status" class="status" role="status">講完後會自動嘗試翻譯</div><p class="hint">會按辨認出嘅文字判斷翻譯方向；語音辨認本身未能可靠地自動識別兩種語言。如認錯，請轉換上方模式再試。</p></div><div class="panel"><label for="original">你講嘅內容（可以手動修改）</label><textarea id="original" placeholder="亦可以喺度輸入英文或繁體中文"></textarea><div class="row"><button id="translate" class="small">🌐 翻譯文字</button><button id="clear" class="small">清除</button></div></div><div class="panel"><label>翻譯結果 <span id="direction"></span></label><div id="translated" aria-live="polite">翻譯會顯示喺度</div><div class="row" style="margin-top:15px"><button id="speak" class="small">🔊 播放譯文</button><button id="copy" class="small">📋 複製</button></div></div><p class="hint">注意：免費翻譯服務主要提供繁體中文書面語，未必係自然廣東話口語；播放聲線亦視乎 iPhone 已安裝嘅語音。文字會傳送到第三方翻譯服務，請勿輸入私人或醫療機密資料。使用時需要網絡。</p></main><script>const $=id=>document.getElementById(id),SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,busy=false,target='en-GB';function status(s){$('status').textContent=s}function language(t){return /[\u3400-\u9fff]/.test(t)?'zh':'en'}async function translate(){let q=$('original').value.trim();if(!q){status('請先講嘢或者輸入文字');return}let source=language(q),pair=source==='zh'?'zh-TW|en':'en|zh-TW';target=source==='zh'?'en-GB':'zh-HK';$('direction').textContent=source==='zh'?'→ English':'→ 繁體中文';$('translated').textContent='翻譯中…';status('翻譯中…');try{let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+encodeURIComponent(pair);let response=await fetch(url);if(!response.ok)throw Error('網絡錯誤');let data=await response.json();if(Number(data.responseStatus)!==200||!data.responseData?.translatedText)throw Error(data.responseDetails||'翻譯服務暫時無法使用');let output=data.responseData.translatedText;$('translated').textContent=output;status('翻譯完成');speak(output)}catch(e){$('translated').textContent='翻譯失敗，請稍後重試。';status('翻譯失敗：'+e.message)}}function speak(t){if(!('speechSynthesis'in window)){status('此裝置未能播放語音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=target;u.rate=.92;let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase()===target.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(target.slice(0,2).toLowerCase()));if(v)u.voice=v;speechSynthesis.speak(u)}$('mic').onclick=()=>{if(busy&&rec){rec.stop();return}if(!SR){status('此 iPhone 瀏覽器未提供網頁語音辨認；可用鍵盤麥克風輸入文字。');$('original').focus();return}rec=new SR();rec.lang=$('recognitionLang').value;rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;rec.onstart=()=>{busy=true;$('mic').textContent='⏹️ 講完請按呢度';status('聆聽中…')};rec.onresult=e=>{$('original').value=e.results[0][0].transcript;translate()};rec.onerror=e=>status('語音辨認失敗（'+e.error+'）。請改用文字輸入或切換辨認模式。');rec.onend=()=>{busy=false;$('mic').textContent='🎙️ 按一下開始講嘢'};try{rec.start()}catch(e){status('無法開始錄音：'+e.message)}};$('translate').onclick=translate;$('speak').onclick=()=>{let t=$('translated').textContent;if(t&&!t.includes('翻譯會顯示')&&!t.includes('翻譯失敗'))speak(t)};$('clear').onclick=()=>{$('original').value='';$('translated').textContent='翻譯會顯示喺度';status('準備就緒')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('translated').textContent);status('已複製')}catch{status('無法複製，請長按文字選取')}};</script></body></html>
